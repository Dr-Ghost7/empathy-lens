<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Deuteranopia (Green-blind CVD) -->
    <filter id="empathy-lens-deuteranopia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="
          0.625 0.375 0.000 0 0
          0.700 0.300 0.000 0 0
          0.000 0.300 0.700 0 0
          0.000 0.000 0.000 1 0
        "
      />
    </filter>

    <!-- Protanopia (Red-blind CVD) -->
    <filter id="empathy-lens-protanopia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="
          0.56667 0.43333 0.00000 0 0
          0.55833 0.44167 0.00000 0 0
          0.00000 0.24167 0.75833 0 0
          0.00000 0.00000 0.00000 1 0
        "
      />
    </filter>

    <!-- Tritanopia (Blue-blind CVD) -->
    <filter id="empathy-lens-tritanopia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="
          0.950 0.050 0.000 0 0
          0.000 0.433 0.567 0 0
          0.000 0.475 0.525 0 0
          0.000 0.000 0.000 1 0
        "
      />
    </filter>

    <!-- Achromatopsia (Monochromacy) -->
    <filter id="empathy-lens-achromatopsia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0.000 0.000 0.000 1 0
        "
      />
    </filter>
  </defs>
</svg>
